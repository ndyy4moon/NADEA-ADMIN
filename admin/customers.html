<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Customers - NADÉA PARFUM</title>
    <link rel="stylesheet" href="../css/admin.css">

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: 'DM Sans', Arial, sans-serif;
            background: #faf6f3;
            color: #493631;
        }

        .admin-layout {
            display: flex;
            min-height: 100vh;
        }

        .sidebar {
            width: 250px;
            min-width: 250px;
            background: #382925;
            color: white;
            padding: 30px 20px;
        }

        .admin-logo {
            font-family: Georgia, serif;
            font-size: 23px;
            letter-spacing: 2px;
            text-align: center;
            margin-bottom: 45px;
            color: #e8c5bd;
        }

        .sidebar-menu {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .sidebar-menu a {
            display: block;
            padding: 13px 16px;
            color: #eadbd5;
            text-decoration: none;
            border-radius: 8px;
            transition: 0.3s;
        }

        .sidebar-menu a:hover,
        .sidebar-menu a.active {
            background: #8c625a;
            color: white;
        }

        .admin-content {
            flex: 1;
            min-width: 0;
            padding: 40px;
        }

        .admin-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 35px;
            padding-bottom: 20px;
            border-bottom: 1px solid #eaded8;
        }

        .admin-header h1 {
            margin: 0;
            font-family: Georgia, serif;
            font-size: 30px;
            font-weight: normal;
        }

        .admin-header p {
            color: #927e76;
            margin: 8px 0 0;
            font-size: 14px;
        }

        .customer-intro {
            background: linear-gradient(120deg, #ead0c9, #f5e8e1);
            padding: 28px;
            border-radius: 14px;
            margin-bottom: 28px;
        }

        .customer-intro h2 {
            font-family: Georgia, serif;
            font-size: 23px;
            font-weight: normal;
            margin: 0 0 8px;
        }

        .customer-intro p {
            margin: 0;
            color: #765d55;
            font-size: 14px;
        }

        .table-wrapper {
            background: white;
            padding: 22px;
            border-radius: 13px;
            box-shadow: 0 5px 20px rgba(65, 43, 35, 0.05);
            overflow-x: auto;
        }

        .customer-table {
            width: 100%;
            border-collapse: collapse;
            min-width: 500px;
        }

        .customer-table th,
        .customer-table td {
            padding: 17px 15px;
            text-align: left;
            border-bottom: 1px solid #f0e9e5;
            font-size: 14px;
        }

        .customer-table th {
            background: #f7eeea;
            color: #65483f;
            font-weight: 600;
        }

        .customer-table tbody tr:hover {
            background: #fcf8f6;
        }

        .customer-table tbody tr:last-child td {
            border-bottom: none;
        }

        @media (max-width: 768px) {
            .admin-layout {
                flex-direction: column;
            }

            .sidebar {
                width: 100%;
                min-width: 0;
                padding: 20px;
            }

            .admin-logo {
                margin-bottom: 20px;
            }

            .sidebar-menu {
                flex-direction: row;
                flex-wrap: wrap;
            }

            .sidebar-menu a {
                padding: 10px;
                font-size: 13px;
            }

            .admin-content {
                padding: 22px 15px;
            }

            .admin-header h1 {
                font-size: 25px;
            }
        }
    </style>
</head>
<body>

<div class="admin-layout">

    <aside class="sidebar">
        <h2 class="admin-logo">NADÉA ADMIN</h2>

        <nav class="sidebar-menu">
            <a href="dashboard.html">Dashboard</a>
            <a href="products.html">Products</a>
            <a href="orders.html">Orders</a>
            <a href="customers.html" class="active">Customers</a>
            <a href="../index.html">View Website</a>
            <a href="#" onclick="logoutAdmin()">Logout</a>
        </nav>
    </aside>

    <main class="admin-content">

        <div class="admin-header">
            <div>
                <h1>Customer Management</h1>
                <p>Kelola dan lihat daftar pelanggan NADÉA PARFUM.</p>
            </div>
        </div>

        <section class="customer-intro">
            <h2>Our Customers</h2>
            <p>Daftar pelanggan yang telah terdaftar di NADÉA PARFUM.</p>
        </section>

        <div class="table-wrapper">
            <table class="customer-table">
                <thead>
                    <tr>
                        <th>No</th>
                        <th>Nama Pelanggan</th>
                        <th>Email</th>
                    </tr>
                </thead>

                <tbody id="admin-customers-list"></tbody>
            </table>
        </div>

    </main>

</div>

<script src="../js/admin.js"></script>

</body>
</html>
