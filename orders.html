<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Order Management | NADÉA PARFUM</title>

    <link rel="stylesheet" href="../css/admin.css">

    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'DM Sans', sans-serif;
            background: #fffaf8;
        }

        .admin-layout {
            display: flex;
            min-height: 100vh;
        }

        .sidebar {
            width: 250px;
            min-width: 250px;
            background: #563f43;
            color: white;
            padding: 30px 20px;
            display: flex;
            flex-direction: column;
            box-sizing: border-box;
        }

        .admin-logo {
            font-family: 'Playfair Display', serif;
            font-size: 23px;
            text-align: center;
            letter-spacing: 1px;
            margin-bottom: 50px;
            color: white;
        }

        .admin-logo span {
            color: #d9a6a9;
        }

        .admin-logo small {
            display: block;
            font-family: 'DM Sans', sans-serif;
            font-size: 10px;
            letter-spacing: 4px;
            margin-top: 10px;
            color: #d9bfc0;
        }

        .sidebar-menu {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .sidebar-menu a {
            display: block;
            padding: 14px 17px;
            color: #eadbdc;
            text-decoration: none;
            font-size: 13px;
            border-radius: 4px;
            transition: 0.3s;
        }

        .sidebar-menu a:hover,
        .sidebar-menu a.active {
            background: #a66f79;
            color: white;
        }

        .logout-btn {
            margin-top: auto;
            padding: 13px;
            background: transparent;
            border: 1px solid #b98d91;
            color: white;
            cursor: pointer;
            font-family: inherit;
            font-size: 13px;
            transition: 0.3s;
        }

        .logout-btn:hover {
            background: #a66f79;
        }

        .admin-content {
            flex: 1;
            min-width: 0;
            padding: 40px;
        }

        .admin-header {
            margin-bottom: 35px;
        }

        .admin-header p {
            color: #b77b86;
            font-size: 10px;
            font-weight: 700;
            letter-spacing: 3px;
            margin-top: 10px;
        }

        .admin-header h1 {
            font-family: 'Playfair Display', serif;
            color: #553d42;
            font-size: 34px;
            font-weight: 500;
        }

        .orders-intro {
            background: linear-gradient(120deg, #f3dede, #f9eeee);
            border: 1px solid #efd8d8;
            padding: 25px 28px;
            margin-bottom: 28px;
        }

        .orders-intro h2 {
            font-family: 'Playfair Display', serif;
            color: #553d42;
            font-weight: 500;
            font-size: 23px;
            margin-bottom: 8px;
        }

        .orders-intro p {
            color: #806b6d;
            font-size: 13px;
        }

        .table-wrapper {
            overflow-x: auto;
            background: white;
            border: 1px solid #f0dfdc;
        }

        .orders-table {
            width: 100%;
            min-width: 750px;
            border-collapse: collapse;
        }

        .orders-table th,
        .orders-table td {
            padding: 17px 16px;
            text-align: left;
            border-bottom: 1px solid #f0e5e2;
            font-size: 13px;
        }

        .orders-table th {
            background: #563f43;
            color: white;
            font-weight: 600;
            letter-spacing: 0.5px;
        }

        .orders-table td {
            color: #806b6d;
        }

        .orders-table tbody tr:hover {
            background: #fffaf8;
        }

        .orders-table select {
            padding: 9px;
            border: 1px solid #eadbd7;
            background: #fffdfc;
            color: #765e5b;
            font-family: inherit;
            font-size: 12px;
            outline: none;
        }

        .orders-table button {
            padding: 9px 14px;
            background: #a66f79;
            color: white;
            border: none;
            cursor: pointer;
            font-family: inherit;
            font-size: 11px;
            transition: 0.3s;
        }

        .orders-table button:hover {
            background: #855b64;
        }

        @media (max-width: 900px) {
            .admin-content {
                padding: 25px;
            }
        }

        @media (max-width: 650px) {
            .admin-layout {
                flex-direction: column;
            }

            .sidebar {
                width: 100%;
                min-width: 0;
                padding: 20px;
            }

            .admin-logo {
                margin-bottom: 20px;
            }

            .sidebar-menu {
                display: grid;
                grid-template-columns: repeat(2, 1fr);
            }

            .logout-btn {
                margin-top: 20px;
            }

            .admin-content {
                padding: 20px;
            }
        }
    </style>
</head>

<body>

    <div class="admin-layout">

        <aside class="sidebar">

            <div class="admin-logo">
                NADÉA <span>PARFUM</span>
                <small>ADMIN PANEL</small>
            </div>

            <nav class="sidebar-menu">
                <a href="dashboard.html">Dashboard</a>
                <a href="products.html">Products</a>
                <a href="orders.html" class="active">Orders</a>
                <a href="customers.html">Customers</a>
                <a href="../index.html">View Website</a>
            </nav>

            <button class="logout-btn" onclick="logoutAdmin()">
                Logout
            </button>

        </aside>

        <main class="admin-content">

            <header class="admin-header">
                <p>NADÉA PARFUM MANAGEMENT</p>
                <h1>Order Management</h1>
            </header>

            <section class="orders-intro">
                <h2>Customer Orders</h2>
                <p>
                    Kelola pesanan pelanggan dan pantau status
                    transaksi NADÉA PARFUM melalui halaman ini.
                </p>
            </section>

            <div class="table-wrapper">

                <table class="orders-table">

                    <thead>
                        <tr>
                            <th>Order ID</th>
                            <th>Customer</th>
                            <th>Total</th>
                            <th>Payment</th>
                            <th>Status</th>
                            <th>Aksi</th>
                        </tr>
                    </thead>

                    <tbody id="admin-orders-list"></tbody>

                </table>

            </div>

        </main>

    </div>

    <script src="../js/admin.js"></script>

</body>
</html>
